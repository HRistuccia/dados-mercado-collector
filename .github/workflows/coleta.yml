name: coleta-mercado

on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Coletar snapshot
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          ANBIMA_DEBUG: "1"
        run: python coletor.py
      - name: Commitar snapshot
        run: |
          git config user.name  "dados-mercado-bot"
          git config user.email "actions@github.com"
          git add snapshots/*.json anbima_raw.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
