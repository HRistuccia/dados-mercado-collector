name: coleta-mercado

# Roda em dia util apos o fechamento da B3 (B3 fecha ~17:55 BRT).
# 21:45 UTC = 18:45 BRT (BRT = UTC-3, sem horario de verao desde 2019).
# O relatorio Cowork diario roda 19h BRT, entao o snapshot ja existe quando ele le.
# Cron do GitHub Actions e best-effort (pode atrasar 5-15 min).
on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write          # necessario para commitar o snapshot no repo

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar snapshot
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          # ANBIMA_DEBUG: "1"   # descomente na 1a execucao para salvar anbima_raw.txt
        run: python coletor.py

      - name: Commitar snapshot
        run: |
          git config user.name  "dados-mercado-bot"
          git config user.email "actions@github.com"
          git add snapshots/*.json || true
          if git diff --cached --quiet; then
            echo "Sem snapshot novo para commitar."
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
